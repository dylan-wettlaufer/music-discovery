[project]
name = "music-discovery"
version = "0.1.0"
description = "Weekly private Spotify playlists made only of tracks you have never played."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "apscheduler>=3.10.4,<4",
    "cryptography>=43",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.30",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[project.scripts]
music-discovery = "music_discovery.cli:app"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
